name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: python -m pip install homeassistant pytest pytest-asyncio ruff
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Import integration modules
        run: >-
          python -c "import importlib;
          [importlib.import_module(f'custom_components.ecoservice_waste_collection.{name}')
          for name in ('api', 'calendar', 'config_flow', 'coordinator', 'entity', 'models', 'sensor', 'vasa_api')]"
      - name: Test
        run: pytest

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
