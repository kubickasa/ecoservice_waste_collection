[project]
name = "ecoservice-waste-collection"
version = "1.0.4"
requires-python = ">=3.14.2"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501", "E701", "E702"]
